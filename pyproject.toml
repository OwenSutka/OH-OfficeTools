[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "office-tools"
version = "0.1.0"
description = "Local, free DOCX, XLSX, PPTX, PDF and CSV I/O with a JSON style system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3",
    "openpyxl>=3.1",
    "pydantic>=2.14",
    "pypdf>=7.1",
    "python-docx>=1.2",
    "python-pptx>=1.0",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pip-licenses>=4.4",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/office_tools"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.mypy]
strict = true
files = ["src"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
